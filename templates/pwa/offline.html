{% extends "base.html" %}
{% block title %}Offline &middot; {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-md py-12 text-center">
  <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-warning-soft text-warning-text">
    <i data-lucide="wifi-off" class="h-8 w-8" aria-hidden="true"></i>
  </span>
  <h1 class="mt-4 text-2xl font-semibold text-foreground">You are offline</h1>
  <p class="mt-2 text-muted-foreground">
    This page is served from the offline cache. Checklist execution and synchronisation
    will be available offline in a later phase.
  </p>
  <a href="/" class="btn btn-primary mt-6">Try again</a>
</div>
{% endblock %}
