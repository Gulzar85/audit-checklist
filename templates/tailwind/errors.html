{# Form-level (non-field) errors, in the design system's alert style. #}
{% if form.non_field_errors %}
  <div class="alert alert-danger mb-4" role="alert">
    <i data-lucide="circle-alert" class="h-5 w-5 shrink-0" aria-hidden="true"></i>
    <ul class="space-y-1">
      {% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  </div>
{% endif %}
