{% if messages %}
  <div class="mb-6 space-y-3" role="status" aria-live="polite">
    {% for message in messages %}
      {% if message.tags == "error" %}
        <div class="alert alert-danger"><i data-lucide="circle-alert" class="h-5 w-5 shrink-0" aria-hidden="true"></i><span>{{ message }}</span></div>
      {% elif message.tags == "warning" %}
        <div class="alert alert-warning"><i data-lucide="triangle-alert" class="h-5 w-5 shrink-0" aria-hidden="true"></i><span>{{ message }}</span></div>
      {% elif message.tags == "success" %}
        <div class="alert alert-success"><i data-lucide="circle-check" class="h-5 w-5 shrink-0" aria-hidden="true"></i><span>{{ message }}</span></div>
      {% else %}
        <div class="alert alert-info"><i data-lucide="info" class="h-5 w-5 shrink-0" aria-hidden="true"></i><span>{{ message }}</span></div>
      {% endif %}
    {% endfor %}
  </div>
{% endif %}
