{% extends "base.html" %}
{% block title %}Page not found &middot; {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-md py-12 text-center">
  <p class="text-5xl font-bold text-link" aria-hidden="true">404</p>
  <h1 class="mt-2 text-2xl font-semibold text-foreground">Page not found</h1>
  <p class="mt-2 text-muted-foreground">The page you requested does not exist, has moved, or you cannot access it.</p>
  <a href="{% url 'core:home' %}" class="btn btn-primary mt-6">Back to home</a>
</div>
{% endblock %}
