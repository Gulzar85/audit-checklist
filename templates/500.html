{% extends "base.html" %}
{% block title %}Server error &middot; {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-md py-12 text-center">
  <p class="text-5xl font-bold text-link" aria-hidden="true">500</p>
  <h1 class="mt-2 text-2xl font-semibold text-foreground">Something went wrong</h1>
  <p class="mt-2 text-muted-foreground">An unexpected error occurred and has been logged. Please try again in a moment.</p>
  <a href="{% url 'core:home' %}" class="btn btn-primary mt-6">Back to home</a>
</div>
{% endblock %}
